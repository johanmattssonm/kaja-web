[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2024"
description = "{{description}}"
license = "{{license}}"

[lib]
crate-type = ["cdylib"]

[dependencies]
kaja-web = "=1.0.3"
wasm-bindgen = "0.2"
gloo = "0.12"
inventory = "0.3"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Element", "HtmlElement", "NodeList", "CustomElementRegistry", "ElementDefinitionOptions"] }
